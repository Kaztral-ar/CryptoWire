<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CryptoWire</title>
  <desc id="desc">A modern dark banner for the Discord and Telegram to Binance Square publishing assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1d"/>
      <stop offset="1" stop-color="#151b32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d6c5"/>
      <stop offset="1" stop-color="#6685ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4b74ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#4b74ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1000" cy="110" r="260" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".7">
    <path d="M790 75h110l55 55h115"/>
    <path d="M830 145h90l45 45h130"/>
    <path d="M790 215h130l45-45h130"/>
    <circle cx="790" cy="75" r="6" fill="#39d6c5"/>
    <circle cx="790" cy="215" r="6" fill="#6685ff"/>
    <circle cx="1070" cy="130" r="6" fill="#39d6c5"/>
    <circle cx="1095" cy="190" r="6" fill="#6685ff"/>
  </g>
  <g transform="translate(88 100)">
    <rect width="104" height="104" rx="28" fill="#17253a" stroke="#365a75"/>
    <path d="M26 32h52M26 52h35M26 72h52" stroke="url(#accent)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="77" cy="52" r="7" fill="#6685ff"/>
  </g>
  <text x="225" y="151" fill="#f5f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="750" letter-spacing="-2">CryptoWire</text>
  <text x="229" y="202" fill="#aab6d1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" letter-spacing="2">ONE INTAKE. TWO PLATFORMS. CONTROLLED PUBLISHING.</text>
  <g transform="translate(230 247)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">
    <rect width="116" height="36" rx="18" fill="#5865f2" fill-opacity=".2" stroke="#5865f2"/>
    <text x="58" y="23" fill="#dce0ff" text-anchor="middle">DISCORD</text>
    <rect x="130" width="126" height="36" rx="18" fill="#0088cc" fill-opacity=".18" stroke="#0088cc"/>
    <text x="193" y="23" fill="#d4efff" text-anchor="middle">TELEGRAM</text>
    <rect x="270" width="158" height="36" rx="18" fill="#1caa91" fill-opacity=".14" stroke="#1caa91"/>
    <text x="349" y="23" fill="#c9fff1" text-anchor="middle">BINANCE SQUARE</text>
  </g>
</svg>